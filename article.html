<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'INFO - Article</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="info.ico">
    <style>
        .header-article {
            background: white;
            padding: 1rem 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .site-logo {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #333;
            gap: 0.5rem;
        }

        .site-logo img {
            width: 24px;
            height: 24px;
        }

        .site-logo span {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .article-page {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
        }

        .article-page-image {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 2rem;
        }

        .article-page-title {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            line-height: 1.3;
            color: #222;
        }

        .article-page-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #eee;
            font-size: 0.95rem;
            color: #666;
        }

        .source-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .source-favicon {
            width: 16px;
            height: 16px;
            border-radius: 3px;
        }

        .article-page-content {
            font-size: 1.2rem;
            line-height: 1.8;
            color: #333;
            margin-bottom: 2rem;
        }

        .article-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
        }

        .back-button {
            background: white;
            border: 1px solid #eee;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
            color: #666;
            text-decoration: none;
        }

        .back-button:hover {
            background: #f8f8f8;
            border-color: #ddd;
        }

        .original-link {
            background: #2196F3;
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            transition: background-color 0.2s ease;
        }

        .original-link:hover {
            background: #1976D2;
        }

        .loading {
            text-align: center;
            padding: 4rem;
            font-size: 1.2rem;
            color: #666;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #2196F3;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .header-article {
                padding: 1rem;
            }

            .article-page {
                padding: 1rem;
                border-radius: 0;
                box-shadow: none;
            }

            .article-page-title {
                font-size: 2rem;
            }

            .article-actions {
                flex-direction: column;
                gap: 1rem;
            }

            .back-button, .original-link {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
    </style>
</head>
<body>
    <header class="header-article">
        <a href="/" class="site-logo">
            <img src="./info.ico" alt="Logo L'INFO" onerror="this.src='https://raw.githubusercontent.com/microsoft/fluentui-system-icons/master/assets/Info/SVG/ic_fluent_info_24_regular.svg'">
            <span>L'INFO</span>
        </a>
    </header>

    <article class="article-page">
        <div id="articleContent" class="loading">
            <div class="loading-spinner"></div>
            <p>Chargement de l'article...</p>
        </div>
    </article>

    <div class="sidebar">
        <p class="copyright">&copy; 2025 L'INFO</p>
        <nav class="footer-links">
            <a href="/mentions-legales">Mentions légales</a>
            <a href="/politique-confidentialite">Politique de confidentialité</a>
            <a href="/contact">Contact</a>
            <a href="/a-propos">À propos</a>
        </nav>
    </div>

    <script src="article.js"></script>
</body>
</html>
